# Manual deploy of an already sealed site. Never scheduled, never on push.
# The verify job has a read-only token. Only the deploy job gets pages/id-token.
# A clean checkout cannot see var/ or /tmp. The operator packs the release with
# `python -m supercoach_via.publish.deploy` and puts that tar at an HTTPS URL
# (a GitHub release asset). This job downloads that URL, checks the seal, and
# uploads those exact site bytes. It does not run Astro again.
# Third-party actions are pinned to full commit SHAs (tag noted alongside).
name: scvia-pages

on:
  workflow_dispatch:
    inputs:
      bundle_url:
        description: "HTTPS URL of a sealed site tar (validation.json, seal.json, site/). Not a repo path."
        required: true
        type: string
      expected_seal:
        description: "seal_sha256 printed by: python -m supercoach_via.publish.deploy pack RELEASE DEST"
        required: true
        type: string
      expected_archive_sha256:
        description: "archive_sha256 printed by that same pack command. Not read from the downloaded tar."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: scvia-pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"
      - name: Install locked environment
        run: uv sync --locked
      - name: Download and verify the sealed bundle
        env:
          BUNDLE_URL: ${{ inputs.bundle_url }}
          EXPECTED_SEAL: ${{ inputs.expected_seal }}
          EXPECTED_ARCHIVE_SHA256: ${{ inputs.expected_archive_sha256 }}
        run: |
          case "$BUNDLE_URL" in
            https://*) ;;
            *) echo "bundle_url must be an https URL" >&2; exit 1 ;;
          esac
          if [ "${#EXPECTED_SEAL}" -ne 64 ] || [ "${#EXPECTED_ARCHIVE_SHA256}" -ne 64 ]; then
            echo "expected_seal and expected_archive_sha256 must be the pack command's digests" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/sealed"
          curl --fail --silent --show-error --location --max-filesize 629145600 \
            --output "$RUNNER_TEMP/sealed/bundle.tar" "$BUNDLE_URL"
          echo "$EXPECTED_ARCHIVE_SHA256  $RUNNER_TEMP/sealed/bundle.tar" | sha256sum -c -
          uv run --locked python -m supercoach_via.publish.deploy verify \
            "$RUNNER_TEMP/sealed/bundle.tar" "$RUNNER_TEMP/sealed/extracted" \
            --expect-seal "$EXPECTED_SEAL" --expect-archive "$EXPECTED_ARCHIVE_SHA256"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/sealed/extracted/site

  deploy:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
